services:
  api:
    build: .
    command: uv run uvicorn api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_PATH: /app/data/appointments.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent:
    build: .
    command: uv run python -m agent.main start
    env_file: .env
    environment:
      DB_PATH: /app/data/appointments.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:

[project]
name = "mykare-voice-ai"
version = "0.1.0"
description = "Healthcare front-desk voice agent — LiveKit Agents + Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[deepgram,cartesia,silero,groq,turn-detector]~=1.0",
    "livekit-plugins-bey",
    "fastapi",
    "uvicorn[standard]",
    "aiosqlite",
    "python-dotenv",
    "pydantic",
    "groq",
    "livekit-api",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

